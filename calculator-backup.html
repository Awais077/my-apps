<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (min-width: 401px) {
            .calculator {
                border-radius: 40px;
                height: 90vh;
            }
        }

        .display-container {
            padding: 20px 10px;
            text-align: right;
            word-break: break-all;
            word-wrap: break-word;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .previous-operand {
            color: #757575;
            font-size: 1.5rem;
            min-height: 2rem;
        }

        .current-operand {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 300;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-bottom: 20px;
        }

        button {
            background-color: #2d2d2d;
            border: none;
            outline: none;
            border-radius: 50%;
            width: 100%;
            aspect-ratio: 1;
            font-size: 1.5rem;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-light {
            background-color: #a5a5a5;
            color: #000000;
        }

        .btn-light:active {
            background-color: #d4d4d4;
        }

        .btn-operator {
            background-color: #ff9f0a;
            color: #ffffff;
            font-size: 1.8rem;
        }

        .btn-operator:active {
            background-color: #ffb74d;
        }

        .btn-zero {
            grid-column: span 2;
            border-radius: 40px;
            aspect-ratio: auto;
            justify-content: flex-start;
            padding-left: 30px;
        }
    </style>
  </head>
  <body>

      <div class="calculator">
          <div class="display-container">
              <div class="previous-operand" id="previous-operand"></div>
              <div class="current-operand" id="current-operand">0</div>
          </div>
          <div class="buttons-grid">
              <button class="btn-light" onclick="clearDisplay()">AC</button>
              <button class="btn-light" onclick="deleteNumber()">⌫</button>
              <button class="btn-light" onclick="appendNumber('%')">%</button>
              <button class="btn-operator" onclick="appendOperator('/')">÷</button>
              
              <button onclick="appendNumber('7')">7</button>
              <button onclick="appendNumber('8')">8</button>
              <button onclick="appendNumber('9')">9</button>
              <button class="btn-operator" onclick="appendOperator('*')">×</button>
              
              <button onclick="appendNumber('4')">4</button>
              <button onclick="appendNumber('5')">5</button>
              <button onclick="appendNumber('6')">6</button>
              <button class="btn-operator" onclick="appendOperator('-')">-</button>
              
              <button onclick="appendNumber('1')">1</button>
              <button onclick="appendNumber('2')">2</button>
              <button onclick="appendNumber('3')">3</button>
              <button class="btn-operator" onclick="appendOperator('+')">+</button>
              
              <button class="btn-zero" onclick="appendNumber('0')">0</button>
              <button onclick="appendNumber('.')">.</button>
              <button class="btn-operator" onclick="compute()">=</button>
          </div>
      </div>

      <script>
          const previousOperandElement = document.getElementById('previous-operand');
          const currentOperandElement = document.getElementById('current-operand');
          
          let currentOperand = '0';
          let previousOperand = '';
          let operation = undefined;
          let resetScreen = false;

          function updateDisplay() {
              currentOperandElement.innerText = formatNumber(currentOperand);
              if (operation != null) {
                  previousOperandElement.innerText = `${formatNumber(previousOperand)} ${operationDisplay(operation)}`;
              } else {
                  previousOperandElement.innerText = '';
              }
          }

          function formatNumber(number) {
              if (number === '') return '';
              const stringNumber = number.toString();
              if (stringNumber.includes('.')) {
                  const parts = stringNumber.split('.');
                  const integerDisplay = parseFloat(parts[0]).toLocaleString('en', { maximumFractionDigits: 0 });
                  return `${integerDisplay}.${parts[1]}`;
              } else {
                  const floatNumber = parseFloat(stringNumber);
                  if (isNaN(floatNumber)) return '';
                  return floatNumber.toLocaleString('en', { maximumFractionDigits: 0 });
              }
          }

          function operationDisplay(op) {
              if (op === '/') return '÷';
              if (op === '*') return '×';
              return op;
          }

          function appendNumber(number) {
              if (currentOperand === '0' || resetScreen) {
                  currentOperand = number;
                  resetScreen = false;
              } else {
                  if (number === '.' && currentOperand.includes('.')) return;
                  currentOperand += number;
              }
              updateDisplay();
          }

          function appendOperator(op) {
              if (currentOperand === '') return;
              if (previousOperand !== '') {
                  compute();
              }
              operation = op;
              previousOperand = currentOperand;
              currentOperand = '';
              updateDisplay();
          }

          function compute() {
              let computation;
              const prev = parseFloat(previousOperand);
              const curr = parseFloat(currentOperand);
              
              if (isNaN(prev) || isNaN(curr)) return;
              
              switch (operation) {
                  case '+':
                      computation = prev + curr;
                      break;
                  case '-':
                      computation = prev - curr;
                      break;
                  case '*':
                      computation = prev * curr;
                      break;
                  case '/':
                      computation = curr === 0 ? 'Error' : prev / curr;
                      break;
                  case '%':
                      computation = prev % curr;
                      break;
                  default:
                      return;
              }
              
              currentOperand = computation.toString();
              operation = undefined;
              previousOperand = '';
              resetScreen = true;
              updateDisplay();
          }

          function clearDisplay() {
              currentOperand = '0';
              previousOperand = '';
              operation = undefined;
              updateDisplay();
          }

          function deleteNumber() {
              if (resetScreen) return;
              if (currentOperand.length === 1 || (currentOperand.length === 2 && currentOperand.startsWith('-'))) {
                  currentOperand = '0';
              } else {
                  currentOperand = currentOperand.slice(0, -1);
              }
              updateDisplay();
          }
      </script>
  </body>
  </html>
