name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.APK_KEYSTORE_BASE64 }}" | base64 -d > myapp.keystore

      - name: Build unsigned release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED" app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks myapp.keystore --ks-key-alias myapp --ks-pass "pass:${{ secrets.APK_KEYSTORE_PASSWORD }}" --key-pass "pass:${{ secrets.APK_KEY_PASSWORD }}" --out "$SIGNED" app-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mera-App
          path: android/app/build/outputs/apk/release/app-release.apk
